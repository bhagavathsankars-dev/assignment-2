<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drawing App</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app">

  <div class="toolbar">
    <div class="tool-group">
      <button class="tool active" id="brush"><i data-lucide="pencil"></i></button>
      <button class="tool" id="rectangle"><i data-lucide="rectangle-horizontal"></i></button>
      <button class="tool" id="circle"><i data-lucide="circle"></i></button>
      <button class="tool" id="triangle"><i data-lucide="triangle"></i></button>
      <button class="tool" id="square"><i data-lucide="square"></i></button>
      <button class="tool" id="line"><i data-lucide="minus"></i></button>
      <button class="tool" id="eraser"><i data-lucide="eraser"></i></button>
    </div>

    
    <div class="tool-group">
      <label>Color</label>
      <input type="color" id="colorPicker" value="#000000">
      <label>Size</label>
      <input type="range" id="brushSize" min="1" max="50" value="5">
    </div>

    <div class="tool-group">
      <button id="addImage"><i data-lucide="image-plus"></i></button>
      <button id="clearCanvas"><i data-lucide="trash-2"></i></button>
      <button id="darkToggle"><i data-lucide="moon"></i></button>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="canvas"></canvas>
  </div>

</div>
<script src="script.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
